# Odyssey — CI Phase 6 (tests métier, zéro infra)
name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  business:
    name: npm test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm test
